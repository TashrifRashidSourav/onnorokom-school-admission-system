server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths (e.g. /my-applications after a refresh)
    # get index.html and React Router renders the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
