name: school-admission

# Every setting has a default, so `docker compose up` works without a .env file.
# Override any of them in .env (see .env.example).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admission}
      POSTGRES_USER: ${POSTGRES_USER:-admission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admission}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives `docker compose down` and `up`.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    image: school-admission-backend
    environment: &backend-environment
      # At most DB_POOL_SIZE connections per backend process: PostgreSQL accepts 100 in
      # total, so several backends (see the multi profile) must share them.
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-admission};Username=${POSTGRES_USER:-admission};Password=${POSTGRES_PASSWORD:-admission};Maximum Pool Size=${DB_POOL_SIZE:-40}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      EXPIRY_SWEEP_SECONDS: ${EXPIRY_SWEEP_SECONDS:-5}
      # Browser origin of the frontend; follows FRONTEND_PORT so CORS keeps working if it changes.
      Cors__AllowedOrigins: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # Healthy once /health answers, which is after the migrations ran at startup.
    # The image has no curl, so bash's /dev/tcp sends the request.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # ---- multi profile: docker compose --profile multi up -d ----
  # A second backend process on port 8081, same image and same database, to show that
  # the seat rules hold across processes. Not started by a plain `docker compose up`.
  backend2:
    profiles: [multi]
    build: ./backend
    image: school-admission-backend
    environment:
      <<: *backend-environment
      # Only the first backend creates or updates the schema; two processes doing it
      # at once on a fresh database could collide.
      Database__MigrateOnStartup: "false"
    ports:
      - "${BACKEND2_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # URL the *browser* uses to reach the backend, written into config.js at start.
      API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ---- test profile: docker compose --profile test run --rm backend-tests ----
  # Not started by a plain `docker compose up`.

  db-test:
    profiles: [test]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admission_test
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
    ports:
      # Published so `dotnet test` on the host can use it too.
      - "${TEST_DB_PORT:-5433}:5432"
    # Throwaway data in memory: fast, and nothing left behind.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission -d admission_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DB_CONNECTION: Host=db-test;Port=5432;Database=admission_test;Username=admission;Password=admission
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  pgdata:
